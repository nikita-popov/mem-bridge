# Include this snippet inside your HTTPS server block.
# Replace /mem-bridge/ with the subpath you want to expose.
# Requires SSL already configured upstream.

location /mem-bridge/ {
    proxy_pass         http://127.0.0.1:8765/;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Prefix /mem-bridge;

    # Required for SSE and long-running requests
    proxy_set_header   Connection        "";
    proxy_buffering    off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    client_max_body_size 16m;
}
