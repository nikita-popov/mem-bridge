# Full nginx server block for mem-bridge.
# Replace YOUR_DOMAIN and certificate paths, then:
#   ln -s /path/to/this/file /etc/nginx/sites-enabled/mem-bridge
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- MCP endpoint ---
    location /mcp/ {
        proxy_pass          http://127.0.0.1:8765/;
        proxy_http_version  1.1;

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Connection        "";

        # Streamable HTTP must not be buffered.
        proxy_buffering     off;
        proxy_cache         off;

        # Long timeout: Perplexity holds the connection during tool execution.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        client_max_body_size 16m;
    }

    # --- health check (no auth, used by monitoring) ---
    location = /healthz {
        proxy_pass http://127.0.0.1:8765/healthz;
    }
}
